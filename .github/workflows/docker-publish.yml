name: Docker Publish

on:
  release:
    types: [created]

env:
  IMAGE: zhaozisong0/rwr-data-agent

jobs:
  docker:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          # Surfaces the release tag in the web header badge.
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          # Layer cache lives in the Actions cache, so `npm ci` and the web build
          # are reused across tags as long as the lockfiles are unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The image ships no configuration. Every knob — DATA_DIR, OUTPUT_DIR,
          # TOOLS_DIR, LLM_API_KEY, DATABASE_URL, PORT — is supplied at runtime
          # via --env-file / compose env_file. See .env.example.
